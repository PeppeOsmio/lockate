services:
  postgres:
    image: postgres:16-bullseye
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: lockate
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d lockate"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8.1.3-alpine
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD:-1234}"]
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DB_URL: postgresql://postgres:5432/lockate
      DB_USERNAME: admin
      DB_PASSWORD: "1234"
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-1234}
      SERVER_PORT: "3118"
    ports:
      - "3118:3118"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started

  admin-ui:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./admin_ui:/app
      - admin_ui_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:3118
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  postgres_data:
  admin_ui_node_modules:
