services:
  postgres:
    image: postgres:16-bullseye
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: lockate
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d lockate"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8.1.3-alpine
    command: ["valkey-server", "--requirepass", "${REDIS_PASSWORD:-1234}"]
    ports:
      - "6379:6379"
    restart: unless-stopped

  fix-volume-permissions:
    image: busybox
    user: root
    volumes:
      - backend_m2:/var/maven/.m2
      - admin_ui_node_modules:/node_modules
    command: chown -R 1000:1000 /var/maven/.m2 /node_modules

  backend:
    image: maven:3-amazoncorretto-25
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_m2:/var/maven/.m2
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      MAVEN_CONFIG: /var/maven/.m2
      DB_URL: postgresql://postgres:5432/lockate
      DB_USERNAME: admin
      DB_PASSWORD: "1234"
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-1234}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me}
      ADMIN_UI_ORIGIN: ${ADMIN_UI_ORIGIN:-http://localhost:5173}
      SERVER_PORT: "3118"
    ports:
      - "3118:3118"
    depends_on:
      fix-volume-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    command: mvn -Duser.home=/var/maven spring-boot:run -Pdev

  admin-ui:
    image: node:22-alpine
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./admin_ui:/app
      - admin_ui_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:3118
    ports:
      - "3119:3119"
    depends_on:
      fix-volume-permissions:
        condition: service_completed_successfully
    command: sh -c "npm install && npm run dev -- --host --port 3119"

volumes:
  postgres_data:
  admin_ui_node_modules:
  backend_m2:
