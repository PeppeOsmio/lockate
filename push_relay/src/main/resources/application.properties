quarkus.http.port=${PORT:8080}
# Behind Cloud Run or a reverse proxy the client is in X-Forwarded-For; exposed directly it isn't,
# and trusting it would let a caller pick its own IP for the rate limit
quarkus.http.proxy.proxy-address-forwarding=${RELAY_BEHIND_PROXY:false}
quarkus.http.proxy.allow-x-forwarded=${RELAY_BEHIND_PROXY:false}
quarkus.http.limits.max-body-size=8K
quarkus.banner.enabled=false

relay.fcm.project-id=${FCM_PROJECT_ID}
relay.fcm.endpoint=${FCM_ENDPOINT:https://fcm.googleapis.com}
# A service-account key file; without it the token comes from the metadata server (Cloud Run)
relay.fcm.credentials-file=${GOOGLE_APPLICATION_CREDENTIALS:}
relay.fcm.metadata-url=http://metadata.google.internal
relay.limits.per-token-per-minute=${RELAY_PER_TOKEN_PER_MINUTE:30}
relay.limits.per-ip-per-minute=${RELAY_PER_IP_PER_MINUTE:1200}

%test.relay.fcm.project-id=test-project
