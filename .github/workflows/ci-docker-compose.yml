name: CI Docker Compose

on:
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - dev-docker-compose.yml
      - .env.example
      - .github/workflows/ci-docker-compose.yml
      - .github/workflows/pr-docker-compose.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/pr-docker-compose.yml
