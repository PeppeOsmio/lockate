name: PR Mobile

on:
  pull_request:
    paths:
      - mobile_app/**
      - .github/workflows/pr-mobile.yml
  workflow_call:

permissions:
  contents: read

# Literal group so it can't collide with the calling workflow's group
concurrency:
  group: pr-mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testDebugUnitTest
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: mobile-test-reports
          path: mobile_app/app/build/reports/tests
