name: Checks Push Relay

on:
  pull_request:
    paths:
      - push_relay/**
      - .github/workflows/checks-push-relay.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: push_relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: make ci
        env:
          MAVEN_ARGS: -B
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: push-relay-test-reports
          path: push_relay/target/surefire-reports
