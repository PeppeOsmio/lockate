name: Checks Docker Compose

on:
  pull_request:
    paths:
      - docker-compose.yml
      - dev-docker-compose.yml
      - .env.example
      - .github/workflows/checks-docker-compose.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.example -f docker-compose.yml config --quiet
      - run: docker compose --env-file .env.example -f dev-docker-compose.yml config --quiet
