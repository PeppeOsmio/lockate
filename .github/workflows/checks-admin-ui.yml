name: Checks Admin UI

on:
  pull_request:
    paths:
      - admin_ui/**
      - .github/workflows/checks-admin-ui.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: admin_ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin_ui/package-lock.json
      - run: npm ci
      - run: make ci
