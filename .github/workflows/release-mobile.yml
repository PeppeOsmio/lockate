name: Release Mobile

on:
  push:
    tags: ["mobile-v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks-mobile.yml

  release:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      LOCKATE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      LOCKATE_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
      LOCKATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: echo "VERSION=${GITHUB_REF_NAME#mobile-v}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LOCKATE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APKs
        working-directory: mobile_app
        run: |
          IFS=. read -r major minor patch <<< "${VERSION%%-*}"
          ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode=$((major * 1000000 + minor * 1000 + patch))
      - name: Verify and rename APKs
        working-directory: mobile_app/app/build/outputs/apk/release
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          count=0
          for apk in app-*-release.apk; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            if grep -q "Android Debug" <<< "$certs"; then
              echo "$apk is signed with the debug key" >&2
              exit 1
            fi
            abi="${apk#app-}"
            abi="${abi%-release.apk}"
            mv "$apk" "lockate-$VERSION-$abi.apk"
            count=$((count + 1))
          done
          if [ "$count" -ne 4 ]; then
            echo "expected 4 APKs, found $count" >&2
            exit 1
          fi
      - name: Publish GitHub release
        working-directory: mobile_app/app/build/outputs/apk/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" lockate-*.apk --clobber
          else
            prerelease=()
            if [[ "$VERSION" == *-* ]]; then
              prerelease=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" --title "Mobile $VERSION" --generate-notes "${prerelease[@]}" lockate-*.apk
          fi
